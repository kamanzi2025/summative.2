# Local infrastructure.
#   Redis only (run Django and Celery from your venv):  docker compose up -d redis
#   Everything in containers:                          docker compose --profile app up --build
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  web:
    profiles: ["app"]
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment: &container-env
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_URL: sqlite:////app/data/db.sqlite3
    volumes:
      - db-data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build: .
    command: celery -A config worker -l info
    env_file: .env
    environment: *container-env
    volumes:
      - db-data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  beat:
    profiles: ["app"]
    build: .
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    env_file: .env
    environment: *container-env
    volumes:
      - db-data:/app/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  db-data:
