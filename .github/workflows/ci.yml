name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required starter files
        run: |
          test -f README.md
          test -f .env.example
          test -f requirements.txt
          test -f .github/pull_request_template.md

      - name: Reject prebuilt Django bootstrap in template source repo
        if: github.repository == 'ALU-BSE/advanced-python-kawa-template'
        run: |
          test ! -f manage.py
          test ! -d config
          test ! -d apps
